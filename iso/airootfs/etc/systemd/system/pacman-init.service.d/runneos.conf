# The [runneos] repository in /etc/pacman.conf demands package signatures
# (Required DatabaseOptional), so the live medium must trust the RunneOS
# packaging key before the first pacman -Sy. The public key arrives in the
# runneos-keyring package; without this extra populate step the stock
# pacman-init would populate only the Arch keyring and every runneos-*
# transaction would fail with "unknown trust".
[Service]
ExecStartPost=/usr/bin/pacman-key --populate runneos
