# Start DMS after Bluetooth.
#
# If bluetooth.service comes up later than the shell, DMS initializes BlueZ before
# the adapter exists and keeps the stale "no adapters" state until dms.service is
# restarted by hand — the panel switch then does nothing. On the laptop this
# happened on 2026-10-13 (see .agents/skills/runneos/references/health.md,
# "Bluetooth ноутбука"). Ordering makes that race impossible; a machine without
# BlueZ is unaffected, because Wants/After on a missing unit is not an error.
[Unit]
Wants=bluetooth.service
After=bluetooth.service
