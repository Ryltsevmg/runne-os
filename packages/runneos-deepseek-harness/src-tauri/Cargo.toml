[package]
name = "runneos-deepseek-harness"
version = "0.1.0"
description = "RunneOS shell for the DeepSeek Harness web UI"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
